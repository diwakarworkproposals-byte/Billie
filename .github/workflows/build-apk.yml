name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Copy Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_output.log
        continue-on-error: true

      - name: Check APK or Output Error Annotation
        run: |
          APK_FILE=$(find android/app/build -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at $APK_FILE"
            cp "$APK_FILE" Billie-POS.apk
          else
            ERR_MSG=$(grep -A 30 -m 1 "What went wrong:" gradle_output.log | tr '\r' ' ' | sed ':a;N;$!ba;s/\n/%0A/g')
            if [ -z "$ERR_MSG" ]; then
              ERR_MSG=$(grep -A 30 -m 1 "Caused by:" gradle_output.log | tr '\r' ' ' | sed ':a;N;$!ba;s/\n/%0A/g')
            fi
            if [ -z "$ERR_MSG" ]; then
              ERR_MSG=$(tail -n 30 gradle_output.log | tr '\r' ' ' | sed ':a;N;$!ba;s/\n/%0A/g')
            fi
            echo "::error title=Gradle Error::$ERR_MSG"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Billie-Android-APK
          path: Billie-POS.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: "Billie Android App (Direct APK)"
          body: |
            ## 📱 Billie POS & Billing App - Android APK

            Latest build features:
            - 🔢 6-Digit PIN Authentication (Mobile & ID login)
            - 🖨️ Bluetooth Thermal Receipt Printer (58mm/80mm)
            - 📷 Camera Barcode / QR Code Scanner
            - 📲 1-Tap Direct WhatsApp Share
            - 🔔 Offline Sync & Native Storage

            **Direct Download:** Click on `Billie-POS.apk` below to download and install directly on your Android phone.
          files: Billie-POS.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
